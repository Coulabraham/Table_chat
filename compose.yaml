services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tablechat}
      POSTGRES_USER: ${POSTGRES_USER:-tablechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tablechat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tablechat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 tablechat.asgi:application"

  celery:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [db, redis]
    command: celery -A tablechat worker -l info --concurrency=2

  celery-beat:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [db, redis]
    command: celery -A tablechat beat -l info

  frontend:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres_data:
  redis_data:
